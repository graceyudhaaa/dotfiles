# Backend
backend = "glx";

# Enable/disable shadows
shadow = false;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.7;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-frame-opacity = 0.0;
# inactive-opacity-override = true;

opacity-rule = [
  # set terminal windows to 90% opacity (active and inactive)
  "80:class_g = 'Alacritty'",
  "80:class_g = 'alacritty'",
  "80:class_g = 'URxvt'",
  "80:class_g = 'urxvt'",
  "80:class_g = 'XTerm'",
  "80:class_g = 'xterm'",
  "80:class_g = 'Terminator'",
  "80:class_g = 'terminator'",
  "80:class_g = 'Gnome-terminal'",
  "80:class_g = 'gnome-terminal'",
  "80:class_g = 'Konsole'",
  "80:class_g = 'konsole'",
  "80:class_g = 'Sakura'",
  "80:class_g = 'sakura'",
  "80:class_g = 'Kitty'",
  "80:class_g = 'kitty'",
  "80:class_g = 'Tilix'",
  "80:class_g = 'tilix'",
  "80:class_g = 'xfce4-terminal'",
  "80:class_g = 'Xfce4-terminal'",
  "80:class_g = 'st'",
  "80:class_g = 'Termite'",
  "80:class_g = 'termite'",
  "80:class_g = 'rxvt'",
  "80:class_g = 'Rofi'",
  "80:class_g = 'rofi'",
  "80:class_g = 'Diodon'",
  "80:class_g = 'diodon'",
  "90:class_g = 'Code'",
  "90:class_g = 'code'",
  "80:class_g = 'Microsoft-edge' && class_i = 'crx__cinhimbnkkaeohfgghhklpknlkffjgod'", # youtube music app
  #7inactive state for terminals
  # "70:class_g = 'Alacritty' && !focused",
  # "70:class_g = 'alacritty' && !focused",
  # "70:class_g = 'URxvt' && !focused",
  # "70:class_g = 'urxvt' && !focused",
  # "70:class_g = 'XTerm' && !focused",
  # "70:class_g = 'xterm' && !focused",
  # "70:class_g = 'Terminator' && !focused",
  # "70:class_g = 'terminator' && !focused",
  # "70:class_g = 'Gnome-terminal' && !focused",
  # "70:class_g = 'gnome-terminal' && !focused",
  # "70:class_g = 'Konsole' && !focused",
  # "70:class_g = 'konsole' && !focused",
  # "70:class_g = 'Sakura' && !focused",
  # "70:class_g = 'sakura' && !focused",
  # "70:class_g = 'Kitty' && !focused",
  # "70:class_g = 'kitty' && !focused",
  # "70:class_g = 'Tilix' && !focused",
  # "70:class_g = 'tilix' && !focused",
  # "70:class_g = 'xfce4-terminal' && !focused",
  # "70:class_g = 'Xfce4-terminal' && !focused",
  # "70:class_g = 'st' && !focused",
  # "70:class_g = 'Termite' && !focused",
  # "70:class_g = 'termite' && !focused",
  # "70:class_g = 'rxvt' && !focused",


  # Set 100% opacity for text/code editors
  # Exclude all fullscreen windows from opacity rules (set to 100%)
  "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "100:class_g *= 'Code'",
  "100:class_g *= 'code'",
  "100:class_g = 'Sublime_text'",
  "100:class_g = 'Sublime Text'",
  "100:class_g = 'Gedit'",
  "100:class_g = 'Mousepad'",
  "100:class_g = 'Leafpad'",
  "100:class_g = 'Notepadqq'",
  "100:class_g = 'Kate'",
  "100:class_g = 'Geany'",
  "100:class_g = 'Emacs'",
  "100:class_g = 'VSCodium'",
  "100:class_g = 'Atom'",
  "100:class_g = 'vim'",
  "100:class_g = 'nvim'",
  "100:class_g = 'Neovide'",
  "100:class_g = 'GVim'",

  # Set 100% opacity for video players/editors
  "100:class_g = 'mpv'",
  "100:class_g = 'Vlc'",
  "100:class_g = 'vlc'",
  "100:class_g = 'Kdenlive'",
  "100:class_g = 'Openshot'",
  "100:class_g = 'Flowblade'",
  "100:class_g = 'Shotcut'",
  "100:class_g = 'Pitivi'",
  "100:class_g = 'Olive-editor'",

  # Set 100% opacity for image viewers
  "100:class_g = 'QView'",
  "100:class_g = 'qView'",
  "100:class_g = 'feh'",
  "100:class_g = 'Gwenview'",
  "100:class_g = 'Eog'",
  "100:class_g = 'eog'",
  "100:class_g = 'Viewnior'",
  "100:class_g = 'ristretto'",

  # Set 100% opacity for creativity tools
  "100:class_g = 'Gimp'",
  "100:class_g = 'gimp'",
  "100:class_g = 'Krita'",
  "100:class_g = 'krita'",
  "100:class_g = 'Inkscape'",
  "100:class_g = 'Blender'",
  "100:class_g = 'MyPaint'",
  "100:class_g = 'Pinta'",
  "100:class_g = 'Darktable'",
  "100:class_g = 'Rawtherapee'",

  # Exclude Lutris games and Steam from opacity rules (set to 100%)
  "100:class_g = 'Lutris'",
  "100:class_g = 'Steam'",

  # Exclude Brave-browser and edge from opacity rules (set to 100%)
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'brave-browser'",
  "100:class_g = 'Brave'",
  "100:class_g = 'brave'",
  "100:class_g = 'microsoft-edge'",
  "100:class_g = 'Microsoft-edge'",
  "100:class_g = 'Microsoft Edge'",
  "100:class_g = 'Edge'",
  
  # inactive state for file managers
  "85:class_g = 'Nautilus' && !focused",
  "85:class_g = 'nautilus' && !focused",
  "85:class_g = 'Thunar' && !focused",
  "85:class_g = 'thunar' && !focused",
  "85:class_g = 'Dolphin' && !focused",
  "85:class_g = 'dolphin' && !focused",
  "85:class_g = 'Pcmanfm' && !focused",
  "85:class_g = 'pcmanfm' && !focused",
  "85:class_g = 'Nemo' && !focused",
  "85:class_g = 'nemo' && !focused",
  "85:class_g = 'Caja' && !focused",
  "85:class_g = 'caja' && !focused",
  "85:class_g = 'Spacefm' && !focused",
  "85:class_g = 'spacefm' && !focused",
  "85:class_g = 'Ranger' && !focused",
  "85:class_g = 'ranger' && !focused",
  "85:class_g = 'Doublecmd' && !focused",
  "85:class_g = 'doublecmd' && !focused",
  "85:class_g = 'Krusader' && !focused",
  "85:class_g = 'krusader' && !focused",

  # Set 80% opacity for common file managers
  "90:class_g = 'Nautilus'",
  "90:class_g = 'nautilus'",
  "90:class_g = 'Thunar'",
  "90:class_g = 'thunar'",
  "90:class_g = 'Dolphin'",
  "90:class_g = 'dolphin'",
  "90:class_g = 'Pcmanfm'",
  "90:class_g = 'pcmanfm'",
  "90:class_g = 'Nemo'",
  "90:class_g = 'nemo'",
  "90:class_g = 'Caja'",
  "90:class_g = 'caja'",
  "90:class_g = 'Spacefm'",
  "90:class_g = 'spacefm'",
  "90:class_g = 'Ranger'",
  "90:class_g = 'ranger'",
  "90:class_g = 'Doublecmd'",
  "90:class_g = 'doublecmd'",
  "90:class_g = 'Krusader'",
  "90:class_g = 'krusader'"

  # Default: 90% opacity for everything else, but exclude Lutris, Steam, Brave-browser, and edge
  # "90:class_g = '*' && class_g != 'Lutris' && class_g != 'Steam' && class_g != 'Brave-browser' && class_g != 'brave-browser' && class_g != 'Brave' && class_g != 'brave' && class_g != 'microsoft-edge' && class_g != 'Microsoft-edge' && class_g != 'Microsoft Edge' && class_g != 'Edge'"
];

# Blur settings
blur:
{
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = true;
  background-fixed = true;
};

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern = "3x3box";

blur-background-exclude = [
  # "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'xfce4-screenshooter'",
  "class_g = 'Conky'",
  "class_g = 'Plank'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "_GTK_FRAME_EXTENTS@:c"
];



unredir-if-possible = false;
# Corner radius for rounded corners (optional)
corner-radius = 0;