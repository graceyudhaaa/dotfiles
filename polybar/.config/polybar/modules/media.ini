[module/media-prev]
type = custom/script
exec = echo "%{T3}󰒮%{T-}"
interval = 60
click-left = ~/.config/polybar/scripts/media-notify.sh previous
label = %output%
label-foreground = ${colors.primary}
format-padding = 0

[module/media-play-pause]
type = custom/script
exec = ~/.config/polybar/scripts/media_play_pause.sh
interval = 1
click-left = ~/.config/polybar/scripts/media_notify.sh play-pause
label = %output%
label-foreground = ${colors.primary}
format-padding = 0

[module/media-next]
type = custom/script
exec = echo "%{T3}󰒭%{T-}"
interval = 60
click-left = ~/.config/polybar/scripts/media_notify.sh next
label = %output%
label-foreground = ${colors.primary}
format-padding = 0

[module/media-status]
type = custom/script
exec = ~/.config/polybar/scripts/media_status.sh
interval = 2
click-left = ~/.config/rofi/rofi-media.sh
label = %output%
label-foreground = ${colors.foreground}
format-padding = 1