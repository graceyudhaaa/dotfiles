[bar/main]
width = 99%
offset-x = 0.5%
height = 17pt
radius = 5

; dpi = 96

override-redirect = false

background = ${colors.background-80}
foreground = ${colors.foreground}

line-size = 0pt

border-size = 2pt
border-color = #00000000

padding-left = 2
padding-right = 2


module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "FontAwesome:size=10;2"

modules-left = whisker-menu xworkspaces fs-root fs-home ;xwindow
; modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth date
modules-right = filesystem pulseaudio memory cpu battery nm-launcher clipboard logout showdesktop
modules-center = date
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true
