format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = ""
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'


staged = '[ staged ](fg:#1a1b26 bg:#9ece6a)'         # green bg
modified = '[ modified ](fg:#1a1b26 bg:#e0af68)'     # yellow/orange bg
untracked = '[ untracked ](fg:#1a1b26 bg:#f7768e)'   # red bg
conflicted = '[ conflicted ](fg:#1a1b26 bg:#bb9af7)' # purple bg
stashed = '[ stashed ](fg:#1a1b26 bg:#7dcfff)'       # cyan bg
ahead = '[ ahead ${count} ](fg:#1a1b26 bg:#7aa2f7)'  # blue bg
behind = '[ behind ${count} ](fg:#1a1b26 bg:#7dcfff)'# cyan bg
diverged = '[ diverged ⇡${ahead_count}⇣${behind_count} ](fg:#1a1b26 bg:#bb9af7)' # purple bg

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[python]
symbol = ''
pyenv_version_name = true
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%H:%M:%S" # Hour:Minute:Seconds Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
